[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-vault-rag"
version = "0.1.0"
description = "Private-first personal knowledge RAG over an Obsidian Markdown vault"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "python-frontmatter>=1.1,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
  "openai>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
